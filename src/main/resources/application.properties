spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# PostgreSQL (ver docker-compose.yml: base demo, usuario demo, clave demo)
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=demo
spring.datasource.password=demo
spring.datasource.driver-class-name=org.postgresql.Driver

# El esquema lo maneja Flyway, no Hibernate: solo valida, nunca crea/modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway: aplica src/main/resources/db/migration/V*__*.sql al arrancar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
