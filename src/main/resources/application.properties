spring.application.name=demo
spring.jackson.deserialization.fail-on-null-for-primitives=false

# API externa que se va a consumir para el catálogo de productos
app.dummyjson.base-url=https://dummyjson.com

# PostgreSQL. Por defecto usa DB_HOST/PORT/NAME (lo que conectan docker-compose
# y el blueprint de Render). Si se define una URL JDBC completa, usar
# DB_JDBC_URL o SPRING_DATASOURCE_URL (evita confundir DB_URL con el formato
# postgres:// que no acepta el driver JDBC).
spring.datasource.url=${DB_JDBC_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:demo}}
spring.datasource.username=${DB_USER:demo}
spring.datasource.password=${DB_PASSWORD:demo}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT: el secreto debe tener al menos 32 bytes (256 bits) para HS256.
app.jwt.secret=${JWT_SECRET:cambiar-este-secreto-en-produccion-0123456789abcdef}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Render (y otros PaaS) inyectan el puerto en PORT.
server.port=${PORT:8080}

# El esquema lo maneja Flyway, no Hibernate: solo valida, nunca crea/modifica.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway: aplica src/main/resources/db/migration/V*__*.sql al arrancar.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
